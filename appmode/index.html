<title>Trợ lý Zalo</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Vỏ hai cột: rail điều hướng bên trái, một panel bên phải. Cùng ngôn ngữ với trang Zalo nên
     hai trang không đọc ra như hai phần mềm. */
  body { margin: 0; display: flex; min-height: 100vh; }
  #rail {
    width: 208px; flex: 0 0 208px; border-right: 1px solid var(--line);
    padding: 14px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
  }
  #rail { background: var(--panel); }
  .railhead {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
    padding: 15px 16px 5px; font-weight: 600;
  }
  .nav {
    display: flex; align-items: center; gap: 9px; padding: 7px 16px; cursor: pointer;
    border: 0; background: none; color: inherit; font: inherit; text-align: left; width: 100%;
  }
  .nav:hover { background: var(--sunk); }
  .nav.on { background: var(--sunk); font-weight: 600; box-shadow: inset 2px 0 0 var(--live); }
  .nav .ic { width: 17px; text-align: center; flex: 0 0 17px; }
  /* Mục chưa có: mờ đi và có dấu, nhưng VẪN bấm được để nó nói ra nó chưa có. Ẩn hẳn thì người
     mua không biết lộ trình; để sáng như mục thật thì họ bấm rồi tưởng phần mềm hỏng. */
  .nav.todo { color: var(--dim); }
  .nav.todo::after {
    content: 'chưa có'; font-size: 9.5px; margin-left: auto; color: var(--dim); opacity: .7;
  }
  #main { flex: 1; padding: 22px 26px; overflow-y: auto; min-width: 0; }
  h1 { font-size: 17px; margin: 0 0 3px; }
  .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 20px; }

  /* NÚT. Trước đây dùng lớp .btn, thứ KHÔNG tồn tại trong app.css — nên chúng hiện ra là nút
     mặc định của trình duyệt trên nền tối, và trông đúng như hỏng. Cùng ngôn ngữ với .modebtn
     của trang Zalo: nền chìm, viền một pixel, bo nhẹ. */
  .btn {
    font: inherit; font-size: 13px; padding: 7px 15px; border-radius: 7px; cursor: pointer;
    background: var(--sunk); color: var(--ink); border: 1px solid var(--line);
    transition: background .12s, border-color .12s;
  }
  .btn:hover:not(:disabled) { background: var(--panel); border-color: var(--dim); }
  .btn:disabled { opacity: .45; cursor: default; }
  /* Nút chính: một trên mỗi panel, và nó là cái tốn tiền. Màu đầy để không ai bấm nhầm nó thay
     cho một nút phụ. */
  .btn.go {
    background: var(--live); border-color: var(--live); color: #0b0d11; font-weight: 600;
  }
  .btn.go:hover:not(:disabled) { filter: brightness(1.09); background: var(--live); }
  .btn.warn { border-color: var(--warn); color: var(--warn); }
  .btn.warn:hover:not(:disabled) { background: rgba(240,180,41,.11); border-color: var(--warn); }

  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .card {
    border: 1px solid var(--line); border-radius: 9px; padding: 13px 17px; min-width: 132px;
    background: var(--panel);
  }
  .card .n { font-size: 26px; font-weight: 600; line-height: 1.15; }
  .card .l { font-size: 11.5px; color: var(--dim); }

  /* Chọn mô hình: thẻ bấm được, không radio trần — cái phải đọc là ĐÁNH ĐỔI giữa các mô hình,
     và một dòng radio không có chỗ cho câu đó. */
  .picks { display: flex; flex-direction: column; gap: 9px; max-width: 560px; }
  .pick {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    padding: 13px 15px; border-radius: 9px; cursor: pointer; font: inherit; color: inherit;
    background: var(--panel); border: 1px solid var(--line);
  }
  .pick:hover { border-color: var(--dim); }
  .pick.on { border-color: var(--live); background: rgba(63,199,127,.07); }
  .pick .dot {
    width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line);
    flex: 0 0 15px; margin-top: 2px;
  }
  .pick.on .dot { border-color: var(--live); background: var(--live); box-shadow: inset 0 0 0 3px var(--panel); }
  .pick .nm { font-weight: 600; font-size: 13.5px; }
  .pick .ds { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .pick .tag {
    margin-left: auto; font-size: 10px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 6px; white-space: nowrap;
  }

  /* Vùng kéo thả. Viền nét đứt là quy ước phổ biến cho "thả vào đây", nên không cần chữ giải
     thích dài. */
  #drop {
    border: 2px dashed var(--line); border-radius: 11px; padding: 30px 20px; text-align: center;
    cursor: pointer; transition: border-color .12s, background .12s;
  }
  #drop.hot { border-color: var(--live); background: rgba(63,199,127,.07); }
  #drop .big { font-size: 14px; margin-bottom: 5px; }
  #drop .small { font-size: 11.5px; color: var(--dim); }

  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
  .flist {
    border: 1px solid var(--line); border-radius: 8px; max-height: 232px; overflow-y: auto;
    font-size: 12.5px; background: var(--panel);
  }
  .flist div { padding: 5px 11px; border-bottom: 1px solid var(--line); }
  .flist div:last-child { border-bottom: 0; }
  .flist .none { color: var(--dim); font-style: italic; }
  .cols { display: flex; gap: 16px; flex-wrap: wrap; }
  .cols > div { flex: 1 1 264px; min-width: 0; }
  .cols h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
    margin: 0 0 7px;
  }

  /* Bảng bước của lượt biên soạn. Chữ đơn cách vì nó là tên tệp và tên công cụ. */
  #steps {
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.65;
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
    max-height: 268px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    background: var(--sunk); color: var(--dim);
  }
  /* Bảng trạng thái của AI Agents. Màu mang tin: chưa điền xong thì bot sẽ gửi cho khách nguyên
     chữ trong ngoặc, nên nó là cảnh báo thật, không một dòng thông tin. */
  .banner { border-radius: 9px; padding: 13px 16px; margin-bottom: 20px; border: 1px solid; }
  .banner.ok  { border-color: var(--live); background: rgba(63,199,127,.08); }
  .banner.bad { border-color: var(--warn); background: rgba(240,180,41,.09); }
  .banner .bt { font-weight: 600; font-size: 13.5px; }
  .banner.ok  .bt { color: var(--live); }
  .banner.bad .bt { color: var(--warn); }
  .banner .bd { font-size: 12.5px; color: var(--dim); margin-top: 3px; }

  .field { margin-bottom: 15px; }
  .field label { display: flex; align-items: baseline; gap: 9px; margin-bottom: 5px; }
  .field .fk { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .field .fc { font-size: 11px; color: var(--dim); }
  .field input {
    width: 100%; font: inherit; font-size: 13px; padding: 8px 11px; border-radius: 7px;
    background: var(--sunk); color: var(--ink); border: 1px solid var(--line);
  }
  .field input:focus { outline: none; border-color: var(--live); }
  .field .fs {
    font-size: 11.5px; color: var(--dim); margin-top: 5px; padding-left: 11px;
    border-left: 2px solid var(--line);
  }
  .note { font-size: 12.5px; color: var(--dim); }

  /* Bảng tra cứu chỉ đọc. Nhãn hẹp cố định nên mắt đọc theo một cột thẳng. */
  .facts { margin-top: 22px; border-top: 1px solid var(--line); }
  .fact { display: flex; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .fact:last-child { border-bottom: 0; }
  .fkk { flex: 0 0 168px; color: var(--dim); }
  .fvv { min-width: 0; word-break: break-word; }
  .fvv .fn { color: var(--dim); font-size: 11.5px; margin-left: 9px; }
  /* Nút bút chì trên hàng tra cứu. Nhỏ và mờ tới khi trỏ vào: nó là đường phụ, không phải việc
     người dùng phải làm ngay. */
  .pen {
    margin-left: auto; flex: 0 0 auto; font: inherit; font-size: 14px; line-height: 1;
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 7px;
    color: var(--dim); cursor: pointer;
  }
  .pen:hover { color: var(--ink); border-color: var(--line); background: var(--sunk); }

  /* Ô sửa toàn văn. Lớp phủ chiếm gần hết màn hình vì đây là một tệp 19 KB: sửa nó trong một hộp
     nhỏ là bắt người dùng cuộn trong một khe hẹp. */
  .sheetback {
    position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 60;
    display: flex; align-items: center; justify-content: center; padding: 3vh 3vw;
  }
  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
    width: min(1000px, 96vw); height: min(90vh, 900px); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sheethead { padding: 13px 17px; border-bottom: 1px solid var(--line); }
  .sheethead .st { font-weight: 600; font-size: 13.5px; }
  .sheethead .sp {
    font-size: 11px; color: var(--dim); margin-top: 2px; word-break: break-all;
    font-family: ui-monospace, Consolas, monospace;
  }
  .sheet textarea {
    flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: none;
    background: var(--sunk); color: var(--ink); padding: 14px 17px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 1.62;
    tab-size: 2;
  }
  .sheetfoot {
    display: flex; gap: 10px; align-items: center; padding: 11px 17px;
    border-top: 1px solid var(--line);
  }
  .sheetfoot .note:first-child { margin-right: auto; }
  /* Hang dien nhanh trong o sua. Nen chim de no tach khoi vung chu ben duoi ma khong can mot
     duong vien nua. */
  .quick { padding: 12px 17px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .quick.done { padding: 9px 17px; }
  .quick .qok { font-size: 12px; color: var(--live); }
  .quick .qh { font-size: 12px; color: var(--dim); margin-bottom: 9px; }
  /* Hai cot khi rong, mot cot khi hep. Hai cho trong thi vua mot hang, va nguoi dung thay ca hai
     cung luc thay vi cuon. */
  .quick .qg { display: grid; grid-template-columns: repeat(auto-fit, minmax(238px, 1fr)); gap: 11px; }
  .quick .qf label { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .quick .qf input {
    width: 100%; font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 6px;
    background: var(--sunk); color: var(--ink); border: 1px solid var(--line);
  }
  .quick .qf input:focus { outline: none; border-color: var(--live); }
  .quick .qr { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .hint {
    border-left: 3px solid var(--line); padding: 3px 0 3px 12px; margin: 16px 0;
    font-size: 12.5px; color: var(--dim);
  }
  .hint code { font-size: 11.5px; color: var(--ink); }
</style>

<nav id="rail"></nav>
<main id="main"></main>

<script src="/assets/manage.js"></script>
